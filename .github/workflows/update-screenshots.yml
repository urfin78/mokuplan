name: Update README screenshots

# Manually triggered. Regenerates the PNGs under docs/screenshots/ from the
# current app, then opens a PR with the changes for review.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Source branch to take the screenshots on (default: current default branch)'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Least privilege by default; jobs that write declare it themselves
permissions:
  contents: read

jobs:
  regen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install CI tooling
        working-directory: .github
        run: npm install --no-audit --no-fund

      - name: Install Chromium for Playwright
        working-directory: .github
        # The runner's Ubuntu mirrors sometimes fail to resolve for a while: apt retries each
        # download, and the whole install is retried before the job gives up
        run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "::warning::Playwright install failed (attempt $attempt of 3)"
            [ "$attempt" -lt 3 ] && sleep 60
          done
          exit 1

      - name: Regenerate screenshots
        env:
          CI: '1'
          NODE_PATH: ${{ github.workspace }}/.github/node_modules
        run: |
          export PATH="${GITHUB_WORKSPACE}/.github/node_modules/.bin:${PATH}"
          npx --prefix .github playwright test \
            --config tests/playwright.config.js \
            tests/readme-screenshots.spec.js

      - name: Open PR with regenerated screenshots
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "docs: regenerate README screenshots"
          title: "docs: regenerate README screenshots"
          body: |
            Automated screenshot refresh from `update-screenshots.yml`.

            Triggered by @${{ github.actor }} on `${{ inputs.branch || github.ref_name }}`.
          branch: docs/update-readme-screenshots
          delete-branch: true
          add-paths: |
            docs/screenshots/**
