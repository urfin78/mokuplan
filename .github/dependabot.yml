version: 2
updates:
    # Actions used by the CI workflows
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          actions:
              patterns: ['*']

    # CI-only tooling (Playwright, ajv, http-server); the app itself has no npm deps.
    # Three.js is loaded via the CDN import map in index.html, which Dependabot does
    # not see — bump it by hand (see CLAUDE.md).
    - package-ecosystem: npm
      directory: /.github
      schedule:
          interval: weekly
      groups:
          ci-tooling:
              patterns: ['*']
